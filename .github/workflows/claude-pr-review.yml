name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read"
            --max-turns 5
          prompt: |
            PR NUMBER: ${{ github.event.pull_request.number }}
            REPO: ${{ github.repository }}

            이 PR을 아래 기준으로 리뷰하고 결과를 `gh pr comment`로 PR에 코멘트로 남겨주세요.

            ## 리뷰 기준

            ### 🔒 보안
            - 하드코딩된 시크릿/자격증명 여부
            - 인증·인가 누락 엔드포인트
            - SQL Injection, IDOR 등 OWASP Top 10 취약점

            ### ⚡ 성능
            - N+1 쿼리 문제
            - DB 인덱스 누락
            - 페이지네이션 누락 (대용량 조회)

            ### 🏗️ 코드 품질
            - 코드 중복 (DRY 원칙)
            - 에러 핸들링 일관성
            - 타입 힌트 정확성

            ### 🔄 동시성 (이 프로젝트 핵심)
            - 트랜잭션 범위 적절성
            - Race condition 가능성
            - 락 전략의 올바른 적용

            ## 출력 형식

            ```
            ## 🤖 Claude PR Review

            ### 요약
            (변경사항 한 줄 요약)

            ### ✅ 잘된 점

            ### ⚠️ 개선 필요
            (심각도: [Critical/High/Medium/Low])

            ### 💡 추가 제안
            ```
